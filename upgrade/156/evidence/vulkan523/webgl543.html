<!doctype html><meta charset=utf-8><title>AROS Vulkan browser validation</title>
<style>body{font:18px sans-serif;background:#edf2f7;color:#142432;margin:24px}h1{font-size:25px}section{background:white;padding:14px;margin:12px 0;border:1px solid #9aaabd}canvas{width:100%;height:90px}pre{white-space:pre-wrap;font:14px monospace}.pass{color:#087b29}.fail{color:#a00}</style>
<h1>AROS · Chromium · ANGLE Vulkan</h1><p>Shader compilation, drawing and pixel readback in the browser.</p><main id=results></main>
<script>
let passed=0;
for(const version of [1,2]){
 const box=document.createElement('section');results.append(box);
 const title=document.createElement('h2');title.textContent='WebGL '+version;box.append(title);
 const canvas=document.createElement('canvas');canvas.width=320;canvas.height=90;box.append(canvas);
 const out=document.createElement('pre');box.append(out);
 try{
  const gl=canvas.getContext(version===2?'webgl2':'webgl',{preserveDrawingBuffer:true});if(!gl)throw Error('Context unavailable');
  const ext=gl.getExtension('WEBGL_debug_renderer_info');
  const renderer=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
  function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
  const vs=shader(gl.VERTEX_SHADER,version===2?'#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0,1);}':'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}');
  const fs=shader(gl.FRAGMENT_SHADER,version===2?'#version 300 es\nprecision mediump float;out vec4 color;void main(){color=vec4(.125,.75,.375,1);}':'precision mediump float;void main(){gl_FragColor=vec4(.125,.75,.375,1);}');
  const program=gl.createProgram();gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);gl.viewport(0,0,320,90);gl.drawArrays(gl.TRIANGLES,0,3);
  const px=new Uint8Array(4);gl.readPixels(160,45,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);const error=gl.getError();
  if(error||Math.abs(px[0]-32)>1||Math.abs(px[1]-191)>1||Math.abs(px[2]-96)>1||px[3]!==255)throw Error('Pixel '+px+' GL error '+error);
  passed++;title.className='pass';title.textContent+=' — PASS';out.textContent='Pixel: '+px.join(', ')+'\n'+renderer;
  console.log('AROS_WEBGL543_PASS version='+version+' pixel='+px.join(',')+' renderer='+renderer);
  gl.deleteBuffer(buf);gl.deleteProgram(program);gl.deleteShader(vs);gl.deleteShader(fs);
 }catch(e){title.className='fail';title.textContent+=' — FAIL';out.textContent=e.message;console.error('AROS_WEBGL543_FAIL version='+version+' '+e.message);}
}
document.title='AROS Vulkan: '+passed+'/2 WebGL tests passed';console.log('AROS_WEBGL543_COMPLETE passed='+passed);
</script>
